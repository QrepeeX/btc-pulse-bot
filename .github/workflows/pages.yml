name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for Telegram bot token pattern
        run: |
          if grep -rEn \
            --exclude-dir=.git --exclude-dir=node_modules \
            --exclude=.env.example \
            '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' .; then
            echo "::error::Telegram bot token pattern found in repo"
            exit 1
          fi
          echo "No token pattern found"

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
